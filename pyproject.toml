[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xzar-mcp"
version = "0.1.3"
description = "Xzar MCP server: crash-test your AI agent on real professional decisions, graded against what actually happened."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.urls]
Homepage = "https://xzar.si"
Documentation = "https://xzar.si/docs.html"

[project.scripts]
xzar-mcp = "xzar_mcp.server:main"

[tool.setuptools]
packages = ["xzar_mcp"]
